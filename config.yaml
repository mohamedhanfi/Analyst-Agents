# Insight Forge â€” single source of configuration
# Canonical reference: Project_Plan/Analyst-Agents.md (Â§1 hard limits, Â§5 retention)

pipeline_version: "4.3.0"

# Â§2.6: human review gate for insights (approve / edit / regenerate).
# false in automated runs; set true for an interactive checkpoint.
review_required: false

llm:
  provider: openrouter
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: OPENROUTER_API_KEY
  model: openrouter/nvidia/nemotron-3.5-lightning:free
  temperature: 0.0        # reproducible LLM stages (Â§5: temperature 0 + seed)
  seed: 42
  max_retries: 3          # LLM retries per agent task (Â§1)
  timeout_seconds: 120
  max_cost_usd: 5.00      # hard stop + fallback reason `cost_limit_exceeded` (Â§1)

# Per-agent overrides: every field optional, inherits from llm.* above.
# QA MUST use a different model than generation (Â§2.8).
agents:
  ingestion:
    role: "Data Ingestion Specialist"
    goal: "Validate, extract, profile and gather business context for the uploaded dataset."
    backstory: "A meticulous ingestion specialist. Never trusts the file; never forwards raw cell content. Follows the deep-validation rules exactly."
    # Â§2.1: Agent 1 uses a small model
    model: openrouter/nvidia/nemotron-3.5-lightning:free
  understanding:
    role: "Data Understanding Specialist"
    goal: "Classify column roles, detect domain and entities, and build a whitlist-only DSL analysis plan."
    backstory: "Understands datasets through profiles and samples, not raw data. Planning is a second task of the same agent."
  cleaning:
    role: "Data Cleaning Strategist"
    goal: "Decide the missing-value/flag/drop strategy per column role Ã— missingness type, then hand it to Python for execution."
    backstory: "Never invents data. Preserves missingness as features when it is a signal. Strategy only â€” Python executes."
  analyst:
    role: "Senior Data Analyst"
    goal: "Compute KPIs and statistical tests on the full dataset using the DSL whitelist, and chart the results."
    backstory: "Full-data thinker. Chooses what to compute, Python computes. Every value carries an evidence_id."
  insight:
    role: "Business Insight Writer"
    goal: "Write evidence-grounded insights and hedged recommendations."
    backstory: "Conservative by construction: descriptive/comparative/correlational claims only; causal claims always gated."
  report:
    role: "Report Renderer"
    goal: "Render the full HTML report and write only the 3-5 sentence executive summary."
    backstory: "Renders from JSON artifacts through the approved template. Never writes numbers manually."
  qa:
    role: "Quality Assurance Auditor"
    goal: "Recompute 100% of KPIs, validate structure, and decide the final verdict deterministically."
    backstory: "Independent guard: Python recomputation is authoritative. Uses a different model than generation."
    # Â§2.8: different model than generation
    model: openrouter/nvidia/nemotron-3.5-lightning:free

# Hard limits (Â§1) â€” deterministic, prevent unbounded loops / resource blowups
limits:
  llm_retries_per_task: 3
  cleaning_max_rechecks: 3        # after: auto-verdict NEEDS_REVISION, reason cleaning_retry_limit_exceeded
  human_input_timeout_min: 5      # after: Generic Analysis Mode (Â§3.5)
  max_file_size_mb: 200           # reject above
  min_rows: 5                     # stop on < 5 rows (Â§2.1)
  max_rows: 5000000               # above â†’ chunked processing (not rejection)
  max_columns: 10000
  max_chart_count: 20             # excess dropped, charts_truncated: true
  stage_timeout_seconds: 600      # default per-stage timeout
  max_run_seconds: 1800           # hard stop â†’ reason run_time_limit_exceeded
  chunk_size: 50000               # pandas read_csv chunksize for >5M rows

# §2.2/semantic-intelligence (task A): numeric ID-like columns (phone
# number, postal code, ...) are detected before the dtype→measure default.
# identifier_llm_fallback only fires in crew mode for the ambiguous band.
understanding:
  identifier_confidence_threshold: 0.7
  identifier_llm_fallback: true

# §2.5 chart-kind proposals (task B): ON now that the golden-eval suite
# exists — validation stays whitelist + data-shape. novelty_penalty biases
# chart ranking toward kind diversity (0.3 per repeat of a chosen kind).
charts:
  enable_kind_proposals: true
  novelty_penalty: 0.3

# Audit M: merge ALL sheets of a multi-sheet XLSX into one dataset (opt-in).
# Off (default) keeps the current pick-one-sheet behavior.
reader:
  merge_sheets: false

# Data retention & privacy (Â§5) â€” days per category; enforced by janitor job
retention:
  raw_days: 7
  run_days: 30
  logs_days: 90
  encrypt_at_rest: true           # AES-256 under runs/ when true
  pii_redacted_from_llm: true     # PII never in LLM context nor logs

# §8 result cache — SQLite under cache/index.sqlite3. Only APPROVED
# deterministic runs are cached; LLM runs are never cached. Also powers
# the "vs previous run" comparison callout in the report.
cache:
  enabled: true
